# Ablegen als: .github/workflows/scrape.yaml (alte Datei ersetzen)
name: Tarife aktualisieren
on:
  schedule:
    - cron: "17 */6 * * *"     # alle 6 Stunden ein Teil der PLZ
  workflow_dispatch:           # zusätzlich per Button manuell startbar
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python -u scraper.py --plz-file plz.txt --max 250
        env:
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          PYTHONUNBUFFERED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
      - name: tarife.json speichern
        if: always()
        run: | git config user.name "tarif-bot" git config user.email "bot@users.noreply.github.com" git add tarife.json state.json || true git diff --cached --quiet || (git commit -m "Tarife aktualisiert" && git pull --rebase && git push)
