app = "strompuls-bot-rwjtsq"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "45s"
  interval = "15s"
  method = "get"
  path = "/health"
  timeout = "5s"
